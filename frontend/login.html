<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup - Kisan Intel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-green-50 flex items-center justify-center min-h-screen p-4">

    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 w-full max-w-md px-4 z-50"></div>

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-8 border-t-4 border-green-600 animate-fade-in-up">
        <div class="text-center mb-6">
            <div class="bg-green-100 text-green-700 p-4 rounded-full h-16 w-16 mx-auto flex items-center justify-center mb-3">
                <i class="fa-solid fa-seedling text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800" id="form-title">Kisan Intel</h1>
            <p class="text-sm text-gray-500 mt-1" id="form-subtitle">Apne account me login karein</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Mobile Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">+91</span>
                    <input type="tel" id="loginPhone" value="9876543210" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Security PIN</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="loginPin" value="1234" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition shadow-md mt-4">Login Karein</button>
            <p class="text-center text-sm mt-4">Khata nahi hai? <button type="button" onclick="toggleForm('signup')" class="text-green-600 font-bold hover:underline">Naya banayein</button></p>
        </form>

        <form id="signupForm" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Pura Naam</label>
                <input type="text" id="signName" placeholder="Jaise: Ram Kumar" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Mobile Number</label>
                <input type="tel" id="signPhone" placeholder="10 digit number" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
            </div>
            <div class="flex gap-2">
                <div class="w-1/2">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Gaon</label>
                    <input type="text" id="signVillage" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <div class="w-1/2">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Zila</label>
                    <input type="text" id="signDistrict" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Naya PIN (4 Digits)</label>
                <input type="password" id="signPin" placeholder="****" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
            </div>
            <button type="submit" id="signupBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md mt-4">Register Karein</button>
            <p class="text-center text-sm mt-4">Pehle se khata hai? <button type="button" onclick="toggleForm('login')" class="text-green-600 font-bold hover:underline">Login karein</button></p>
        </form>
    </div>

    <script>
        function toggleForm(type) {
            if (type === 'signup') {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('signupForm').classList.remove('hidden');
                document.getElementById('form-title').innerText = "Naya Khata";
                document.getElementById('form-subtitle').innerText = "Kisan Intel me aapka swagat hai";
            } else {
                document.getElementById('signupForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('form-title').innerText = "Kisan Intel";
                document.getElementById('form-subtitle').innerText = "Apne account me login karein";
            }
        }
    </script>
    <script src="auth.js"></script>
</body>

</html>
